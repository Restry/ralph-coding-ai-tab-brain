<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Brain</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="header">
    <h1 class="header-title">Tab Brain</h1>
    <span class="tab-count" id="tabCount">-- tabs</span>
  </header>

  <main class="content">
    <section class="group-section">
      <button class="btn-group-now" id="groupNowBtn">Group Now</button>
      <div class="status" id="status"></div>
    </section>

    <section class="groups-list-section">
      <h2 class="section-title">Current Groups</h2>
      <div id="groupsList" class="groups-list"></div>
    </section>

    <section class="stale-section">
      <div class="stale-header">
        <h2 class="section-title">Close Recommendations <span id="staleCount" class="stale-count-badge"></span></h2>
        <button class="btn-archive-all" id="archiveAllBtn" style="display:none;">Archive &amp; Close All</button>
      </div>
      <button class="btn-recommend" id="recommendBtn">Recommend Tabs to Close</button>
      <div id="staleList" class="stale-list"></div>
    </section>

    <section class="kb-section">
      <h2 class="section-title">Knowledge Base</h2>
      <div class="kb-stats" id="kbStats"></div>
      <input type="text" class="kb-search-input" id="kbSearchInput" placeholder="Search knowledge...">
      <div id="kbResults" class="kb-results"></div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
